<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdsoFitness Chatbot</title>
    <style>
        html, body{
          margin:0;
          padding:0;
          font-family:Arial,sans-serif;
          background:#fff;
          height:100%;
        }
        .chat-header{
          background:#0d6efd;
          color:#fff;
          padding:15px;
          text-align:center;
          font-weight:bold;
          position:relative;
        }
        .close-btn{
          position:absolute;
          right:15px;
          top:12px;
          background:none;
          border:none;
          color:#fff;
          font-size:18px;
          cursor:pointer;
        }
        .messages{
          flex:1;
          padding:15px;
          overflow-y:auto;
          background:#f4f4f4;
          display:flex;
          flex-direction:column;
          height:calc(100% - 120px);
        }
        .message{
          padding:10px 14px;
          border-radius:15px;
          margin:6px 0;
          max-width:75%;
          font-size:14px;
        }
        .user{
          background:#ffc107;
          color:#111;
          align-self:flex-end;
        }
        .bot{
          background:#0d6efd;
          color:#fff;
          align-self:flex-start;
        }
        .input-area{
          display:flex;
          border-top:1px solid #ccc;
          padding:10px;
        }
        .input-area input{
          flex:1;
          padding:12px;
          border:none;
          outline:none;
        }
        .input-area button{
          background:#111;
          color:#ffc107;
          border:none;
          padding:0 20px;
          cursor:pointer;
          font-weight:bold;
        }
    </style>
</head>
<body>
<div class="chat-header">
    AdsoFitness 💪
    <button class="close-btn" onclick="closeChat()">✖</button>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Escribe tu pregunta...">
    <button id="sendBtn">Enviar</button>
</div>

<script>
    const messages = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text,sender){
        const div=document.createElement("div");
        div.classList.add("message",sender);
        div.textContent=text;
        messages.appendChild(div);
        messages.scrollTop=messages.scrollHeight;
    }

    function botResponse(input){
        const pregunta=input.toLowerCase();
        if(pregunta.includes("bajar")||pregunta.includes("peso")||pregunta.includes("adelgazar")||pregunta.includes("grasa"))
            return "Para bajar de peso combina entrenamiento de fuerza 3-4 días con cardio y reduce azúcares y fritos.";
        if(pregunta.includes("masa")||pregunta.includes("musculo")||pregunta.includes("aumentar"))
            return "Para aumentar masa muscular entrena fuerza 4-5 días y consume suficiente proteína.";
        if(pregunta.includes("comida")||pregunta.includes("alimentacion")||pregunta.includes("dieta"))
            return "Incluye proteína, arroz o papa, vegetales y buena hidratación.";
        if(pregunta.includes("rutina")||pregunta.includes("ejercicios"))
            return "Como principiante puedes hacer rutina full body 3 veces por semana.";
        if(pregunta.includes("dias"))
            return "Puedes entrenar entre 3 y 4 días por semana.";
        if(pregunta.includes("dolor"))
            return "Es normal dolor muscular al inicio. Si es dolor fuerte en articulaciones debes descansar.";
        return "Soy tu asistente AdsoFitness 💛 Pregunta sobre rutinas, alimentación o objetivos.";
    }

    function sendMessage(){
        const text=userInput.value.trim();
        if(!text) return;
        addMessage(text,"user");
        userInput.value="";
        setTimeout(()=>addMessage(botResponse(text),"bot"),400);
    }

    sendBtn.addEventListener("click",sendMessage);
    userInput.addEventListener("keypress",(e)=>{ if(e.key==="Enter") sendMessage(); });

    addMessage("Hola 👋 Soy tu asistente AdsoFitness. Puedo ayudarte con rutinas, alimentación y objetivos 💪","bot");

    function closeChat(){
        if(typeof AndroidInterface!=="undefined"){
            AndroidInterface.closeChat(); // Cierra ChatActivity y vuelve al Lobby
        }
    }
</script>
</body>
</html>
