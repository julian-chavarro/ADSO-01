<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdsoFitness Chatbot</title>
    <style>
        html, body{
          margin:0;
          padding:0;
          font-family:Arial,sans-serif;
          background:#fff;
          height:100%;
        }
        .chat-header{
          background:#0d6efd;
          color:#fff;
          padding:15px;
          text-align:center;
          font-weight:bold;
          position:relative;
        }
        .close-btn{
          position:absolute;
          right:15px;
          top:12px;
          background:none;
          border:none;
          color:#fff;
          font-size:18px;
          cursor:pointer;
        }
        .messages{
          flex:1;
          padding:15px;
          overflow-y:auto;
          background:#f4f4f4;
          display:flex;
          flex-direction:column;
          height:calc(100% - 120px);
        }
        .message{
          padding:10px 14px;
          border-radius:15px;
          margin:6px 0;
          max-width:75%;
          font-size:14px;
        }
        .user{
          background:#ffc107;
          color:#111;
          align-self:flex-end;
        }
        .bot{
          background:#0d6efd;
          color:#fff;
          align-self:flex-start;
        }
        .input-area{
          display:flex;
          border-top:1px solid #ccc;
          padding:10px;
        }
        .input-area input{
          flex:1;
          padding:12px;
          border:none;
          outline:none;
        }
        .input-area button{
          background:#111;
          color:#ffc107;
          border:none;
          padding:0 20px;
          cursor:pointer;
          font-weight:bold;
        }
    </style>
</head>
<body>
<div class="chat-header">
    AdsoFitness 💪
    <button class="close-btn" onclick="closeChat()">✖</button>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Escribe tu pregunta...">
    <button id="sendBtn">Enviar</button>
</div>

<script>
    const messages = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text,sender){
        const div=document.createElement("div");
        div.classList.add("message",sender);
        div.textContent=text;
        messages.appendChild(div);
        messages.scrollTop=messages.scrollHeight;
    }

    function botResponse(input){
    const pregunta = input.toLowerCase();

    // 🔻 OBJETIVO: BAJAR DE PESO
    if(pregunta.includes("bajar") || pregunta.includes("peso") || pregunta.includes("adelgazar") || pregunta.includes("grasa")){
        return "Para bajar grasa enfócate en déficit calórico, entrena fuerza 3-4 días y agrega cardio. Prioriza comida real y evita ultraprocesados.";
    }

    // 🔻 OBJETIVO: GANAR MASA MUSCULAR
    if(pregunta.includes("masa") || pregunta.includes("musculo") || pregunta.includes("aumentar")){
        return "Para ganar masa muscular entrena fuerza 4-5 días, aplica sobrecarga progresiva y consume suficiente proteína (1.6 - 2g por kg de peso).";
    }

    // 🔻 RUTINAS
    if(pregunta.includes("rutina") || pregunta.includes("ejercicio")){
        return "Una buena rutina depende de tu nivel. Principiantes: full body 3 días. Intermedio: torso-pierna. Avanzado: push pull legs.";
    }

    // 🔻 TÉCNICA
    if(pregunta.includes("tecnica") || pregunta.includes("postura") || pregunta.includes("forma")){
        return "La técnica es clave. Prioriza ejecución controlada, rango completo de movimiento y evita levantar más peso del que puedes controlar.";
    }

    // 🔻 SERIES Y REPETICIONES
    if(pregunta.includes("series") || pregunta.includes("repeticiones")){
        return "Para hipertrofia: 3-4 series de 8-12 reps. Fuerza: 4-6 reps. Resistencia: 12-15 reps.";
    }

    // 🔻 DESCANSO
    if(pregunta.includes("descanso")){
        return "Descansa entre 60-90 segundos para hipertrofia. Dormir bien es clave para recuperar y crecer.";
    }

    // 🔻 ALIMENTACIÓN GENERAL
    if(pregunta.includes("comida") || pregunta.includes("alimentacion") || pregunta.includes("dieta")){
        return "Incluye proteína (pollo, huevos), carbohidratos (arroz, papa) y grasas saludables (aguacate). Mantente hidratado.";
    }

    // 🔻 PRE ENTRENAMIENTO
    if(pregunta.includes("antes") || pregunta.includes("pre entreno")){
        return "Antes de entrenar consume carbohidratos y algo de proteína: ejemplo arroz con pollo o avena con huevo.";
    }

    // 🔻 POST ENTRENAMIENTO
    if(pregunta.includes("despues") || pregunta.includes("post entreno")){
        return "Después de entrenar consume proteína y carbohidratos para recuperación: pollo con arroz o batido con fruta.";
    }

    // 🔻 CARDIO
    if(pregunta.includes("cardio")){
        return "El cardio ayuda a quemar calorías, pero no reemplaza el entrenamiento de fuerza.";
    }

    // 🔻 DÍAS DE ENTRENAMIENTO
    if(pregunta.includes("dias")){
        return "Puedes entrenar 3-5 días por semana dependiendo de tu objetivo y nivel.";
    }

    // 🔻 DOLOR
    if(pregunta.includes("dolor")){
        return "El dolor muscular es normal al inicio. Si es dolor articular o muy fuerte, descansa y revisa técnica.";
    }

    // 🔻 PROGRESO
    if(pregunta.includes("progreso") || pregunta.includes("mejorar")){
        return "Para progresar aumenta peso, repeticiones o mejora la técnica cada semana.";
    }

    // 🔻 PRINCIPIANTES
    if(pregunta.includes("principiante") || pregunta.includes("empezar")){
        return "Empieza con ejercicios básicos, aprende técnica y sé constante. No busques resultados rápidos.";
    }

    // 🔻 SUPLEMENTOS
    if(pregunta.includes("suplemento") || pregunta.includes("proteina")){
        return "Los suplementos ayudan pero no son necesarios. Lo más importante es tu alimentación.";
    }

    // 🔻 ABDOMEN
    if(pregunta.includes("abdomen") || pregunta.includes("abs")){
        return "El abdomen se marca con dieta y déficit calórico. Entrénalo 2-3 veces por semana.";
    }

    // 🔻 MOTIVACIÓN
    if(pregunta.includes("motivacion")){
        return "La disciplina vence a la motivación. Entrena aunque no tengas ganas.";
    }

    // 🔻 RESPUESTA GENERAL
    return "Soy tu asistente AdsoFitness 💛 Pregunta sobre rutinas, alimentación, técnica o tus objetivos.";

    }

    function sendMessage(){
        const text=userInput.value.trim();
        if(!text) return;
        addMessage(text,"user");
        userInput.value="";
        setTimeout(()=>addMessage(botResponse(text),"bot"),400);
    }

    sendBtn.addEventListener("click",sendMessage);
    userInput.addEventListener("keypress",(e)=>{ if(e.key==="Enter") sendMessage(); });

    addMessage("Hola 👋 Soy tu asistente AdsoFitness. Puedo ayudarte con rutinas, alimentación y objetivos 💪","bot");

    function closeChat(){
        if(typeof AndroidInterface!=="undefined"){
            AndroidInterface.closeChat(); // Cierra ChatActivity y vuelve al Lobby
        }
    }
</script>
</body>
</html>
