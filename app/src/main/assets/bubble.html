<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burbuja Chat</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
        }

        /* CÍRCULO AMARILLO */
        .chat-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffc107; /* Amarillo */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 9999;
            transition: transform 0.3s;
            font-size: 28px;
            color: #111;
            border: 4px solid #fff; /* Borde blanco opcional */
        }

        .chat-bubble:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<div class="chat-bubble" id="chatToggle">💬</div>

<script>
    const chatToggle = document.getElementById("chatToggle");
    chatToggle.addEventListener("click", () => {
        if (typeof AndroidInterface !== "undefined") {
            AndroidInterface.openFullChat();
        }
    });
</script>
</body>
</html>
